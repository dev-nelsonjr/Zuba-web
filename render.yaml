services:
  - type: web
    name: zuba-web
    runtime: static
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
